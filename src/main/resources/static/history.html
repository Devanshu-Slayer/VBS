<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VBS — Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #0a0a0f;
      --surface: #0f0f18;
      --card: #16161f;
      --card2: #1c1c28;
      --border: rgba(255,255,255,0.06);
      --border2: rgba(255,255,255,0.12);
      --gold: #f5c842;
      --gold-dim: rgba(245,200,66,0.15);
      --teal: #00d4aa;
      --teal-dim: rgba(0,212,170,0.12);
      --rose: #ff4d6d;
      --rose-dim: rgba(255,77,109,0.12);
      --sky: #60a5fa;
      --sky-dim: rgba(96,165,250,0.12);
      --violet: #a78bfa;
      --violet-dim: rgba(167,139,250,0.12);
      --text: #f0f0f5;
      --muted: #6b6b85;
      --muted2: #9898b2;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Lato', sans-serif;
      background: var(--ink);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.5;
    }

    body::after {
      content: '';
      position: fixed;
      top: -200px;
      left: 50%;
      transform: translateX(-50%);
      width: 700px;
      height: 500px;
      background: radial-gradient(ellipse, rgba(245,200,66,0.06) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .page-wrap {
      position: relative;
      z-index: 1;
      max-width: 860px;
      margin: 0 auto;
      padding: 0 24px 60px;
    }

    /* ── Top Nav ── */
    .topnav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 28px 0 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 40px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-mark {
      width: 40px;
      height: 40px;
      background: var(--gold);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Playfair Display', serif;
      font-weight: 800;
      font-size: 15px;
      color: #000;
      flex-shrink: 0;
    }

    .logo-text {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 18px;
      letter-spacing: -0.3px;
    }

    .logo-sub {
      font-size: 11px;
      color: var(--muted);
      font-weight: 400;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-top: 1px;
    }

    .nav-pill {
      padding: 8px 20px;
      border-radius: 100px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid var(--border2);
      background: var(--card);
      color: var(--muted2);
      transition: all 0.2s;
      font-family: 'Lato', sans-serif;
    }

    .nav-pill:hover {
      background: var(--rose-dim);
      color: var(--rose);
      border-color: var(--rose);
    }

    /* ── Welcome Hero ── */
    .hero {
      text-align: center;
      margin-bottom: 40px;
    }

    .hero-greeting {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--muted);
      font-weight: 400;
      margin-bottom: 8px;
    }

    .hero-name {
      font-family: 'Playfair Display', serif;
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -1.5px;
      line-height: 1;
      margin-bottom: 8px;
    }

    .hero-name span { color: var(--gold); }

    .hero-id {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.5px;
    }

    /* ── Balance Card ── */
    .balance-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-top: 2px solid var(--gold);
      border-radius: 20px;
      padding: 36px;
      text-align: center;
      margin-bottom: 24px;
      position: relative;
      overflow: hidden;
      transition: all 0.3s;
    }

    .balance-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 0%, var(--gold-dim), transparent 70%);
      pointer-events: none;
    }

    .balance-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 14px;
    }

    .balance-amount {
      font-family: 'Playfair Display', serif;
      font-size: 52px;
      font-weight: 800;
      letter-spacing: -2px;
      color: var(--gold);
      line-height: 1;
    }

    .balance-currency {
      font-size: 28px;
      vertical-align: super;
      opacity: 0.7;
    }

    /* ── Flash ── */
    .flash {
      position: fixed;
      top: 24px;
      right: 24px;
      z-index: 9999;
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 500;
      max-width: 300px;
      display: none;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      animation: slideIn 0.3s ease;
    }

    .flash.show { display: flex; }
    .flash.success { background: var(--card2); border: 1px solid var(--gold); color: var(--gold); }
    .flash.error   { background: var(--card2); border: 1px solid var(--rose); color: var(--rose); }

    @keyframes slideIn {
      from { transform: translateX(20px); opacity: 0; }
      to   { transform: translateX(0); opacity: 1; }
    }

    /* ── Action Buttons ── */
    .action-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 14px;
      margin-bottom: 40px;
    }

    .action-btn {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px 16px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      transition: all 0.25s;
      text-align: center;
    }

    .action-btn:hover {
      transform: translateY(-4px);
      border-color: var(--border2);
    }

    .action-btn .a-icon {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      transition: all 0.25s;
    }

    .action-btn .a-label {
      font-family: 'Playfair Display', serif;
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.2px;
    }

    .action-btn .a-sub {
      font-size: 11px;
      color: var(--muted);
      font-weight: 400;
    }

    /* Colors per action */
    .ab-withdraw { border-top: 2px solid var(--rose); }
    .ab-withdraw .a-icon { background: var(--rose-dim); }
    .ab-withdraw:hover { box-shadow: 0 8px 24px rgba(255,77,109,0.15); }

    .ab-deposit { border-top: 2px solid var(--sky); }
    .ab-deposit .a-icon { background: var(--sky-dim); }
    .ab-deposit:hover { box-shadow: 0 8px 24px rgba(96,165,250,0.15); }

    .ab-transfer { border-top: 2px solid var(--gold); }
    .ab-transfer .a-icon { background: var(--gold-dim); }
    .ab-transfer:hover { box-shadow: 0 8px 24px rgba(0,212,170,0.15); }

    .ab-passbook { border-top: 2px solid var(--gold); }
    .ab-passbook .a-icon { background: var(--gold-dim); }
    .ab-passbook:hover { box-shadow: 0 8px 24px rgba(245,200,66,0.15); }

    .ab-update { border-top: 2px solid var(--violet); }
    .ab-update .a-icon { background: var(--violet-dim); }
    .ab-update:hover { box-shadow: 0 8px 24px rgba(167,139,250,0.15); }

    /* ── Modal ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(6px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-overlay.show { display: flex; }

    .modal-box {
      background: var(--card);
      border: 1px solid var(--border2);
      border-radius: 20px;
      padding: 32px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.5);
      animation: modalIn 0.3s ease;
    }

    @keyframes modalIn {
      from { transform: scale(0.95); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }

    .modal-title {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 24px;
    }

    .form-group { margin-bottom: 16px; }

    .form-label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 8px;
    }

    .form-input, .form-select {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      color: var(--text);
      font-family: 'Lato', sans-serif;
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }

    .form-input:focus, .form-select:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(0,212,170,0.1);
    }

    .form-input::placeholder { color: var(--muted); }

    .modal-footer {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 24px;
    }

    .btn-primary {
      padding: 12px 24px;
      background: var(--gold);
      color: #000;
      border: none;
      border-radius: 100px;
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      flex: 1;
    }

    .btn-primary:hover { background: #ffd700; transform: translateY(-1px); }

    .btn-ghost {
      padding: 12px 24px;
      background: transparent;
      color: var(--muted2);
      border: 1px solid var(--border);
      border-radius: 100px;
      font-family: 'Playfair Display', serif;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-ghost:hover { background: var(--card2); color: var(--text); }

    @media (max-width: 600px) {
      .action-grid { grid-template-columns: repeat(2, 1fr); }
      .hero-name { font-size: 28px; }
      .balance-amount { font-size: 38px; }
    }
  </style>
</head>
<body>

<div class="flash" id="flash">
  <span id="flashIcon">✓</span>
  <span id="flashText"></span>
</div>

<div class="page-wrap">

  <!-- Nav -->
  <nav class="topnav">
    <div class="logo">
      <div class="logo-mark">VB</div>
      <div>
        <div class="logo-text">VBS</div>
        <div class="logo-sub">Virtual Banking System</div>
      </div>
    </div>
    <button class="nav-pill" onclick="logout()">→ Logout</button>
  </nav>

  <!-- Hero -->
  <div class="hero">
    <div class="hero-greeting">Good day</div>
    <div class="hero-name">Welcome, <span id="welcomeName">User</span></div>
    <div class="hero-id">Account ID: <strong id="userId">—</strong></div>
  </div>

  <!-- Balance -->
  <div class="balance-card">
    <div class="balance-label">Available Balance</div>
    <div class="balance-amount"><span class="balance-currency">₹</span><span id="balance">0.00</span></div>
  </div>

  <!-- Actions -->
  <div class="action-grid">
    <button class="action-btn ab-withdraw" onclick="openModal('withdrawModal')">
      <div class="a-icon">↑</div>
      <div>
        <div class="a-label">Withdraw</div>
        <div class="a-sub">Debit funds</div>
      </div>
    </button>

    <button class="action-btn ab-deposit" onclick="openModal('depositModal')">
      <div class="a-icon">↓</div>
      <div>
        <div class="a-label">Deposit</div>
        <div class="a-sub">Add funds</div>
      </div>
    </button>

    <button class="action-btn ab-transfer" onclick="openModal('transferModal')">
      <div class="a-icon">⇄</div>
      <div>
        <div class="a-label">Transfer</div>
        <div class="a-sub">Send money</div>
      </div>
    </button>

    <button class="action-btn ab-passbook" onclick="goToPassbook()">
      <div class="a-icon">📒</div>
      <div>
        <div class="a-label">Passbook</div>
        <div class="a-sub">View history</div>
      </div>
    </button>

    <button class="action-btn ab-update" onclick="openModal('updateModal')">
      <div class="a-icon">✎</div>
      <div>
        <div class="a-label">Update</div>
        <div class="a-sub">Edit profile</div>
      </div>
    </button>
  </div>

</div>

<!-- Withdraw Modal -->
<div class="modal-overlay" id="withdrawModal">
  <div class="modal-box">
    <div class="modal-title">Withdraw Funds</div>
    <form id="withdrawForm">
      <div class="form-group">
        <label class="form-label">Amount (₹)</label>
        <input class="form-input" type="number" id="withdrawAmount" step="0.01" min="0" placeholder="0.00" required>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-ghost" onclick="closeModal('withdrawModal')">Cancel</button>
        <button type="submit" class="btn-primary" style="background:var(--rose);color:#fff;">Withdraw</button>
      </div>
    </form>
  </div>
</div>

<!-- Deposit Modal -->
<div class="modal-overlay" id="depositModal">
  <div class="modal-box">
    <div class="modal-title">Deposit Funds</div>
    <form id="depositForm">
      <div class="form-group">
        <label class="form-label">Amount (₹)</label>
        <input class="form-input" type="number" id="depositAmount" step="0.01" min="0" placeholder="0.00" required>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-ghost" onclick="closeModal('depositModal')">Cancel</button>
        <button type="submit" class="btn-primary" style="background:var(--sky);color:#000;">Deposit</button>
      </div>
    </form>
  </div>
</div>

<!-- Transfer Modal -->
<div class="modal-overlay" id="transferModal">
  <div class="modal-box">
    <div class="modal-title">Transfer Funds</div>
    <form id="transferForm">
      <div class="form-group">
        <label class="form-label">Recipient Username</label>
        <input class="form-input" type="text" id="transferUsername" placeholder="Enter username" required>
      </div>
      <div class="form-group">
        <label class="form-label">Amount (₹)</label>
        <input class="form-input" type="number" id="transferAmount" step="0.01" min="0" placeholder="0.00" required>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-ghost" onclick="closeModal('transferModal')">Cancel</button>
        <button type="submit" class="btn-primary">Send</button>
      </div>
    </form>
  </div>
</div>

<!-- Update Profile Modal -->
<div class="modal-overlay" id="updateModal">
  <div class="modal-box">
    <div class="modal-title">Update Profile</div>
    <form id="updateForm">
      <div class="form-group">
        <label class="form-label">Field</label>
        <select class="form-select" id="updateKey" required>
          <option value="name">Name</option>
          <option value="password">Password</option>
          <option value="email">Email</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">New Value</label>
        <input class="form-input" type="text" id="updateValue" placeholder="Enter new value" required>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-ghost" onclick="closeModal('updateModal')">Cancel</button>
        <button type="submit" class="btn-primary" style="background:var(--violet);color:#fff;">Update</button>
      </div>
    </form>
  </div>
</div>

<script>
  const API_URL = 'http://localhost:8081';
  let userId = null;
  let role = 'customer';

  function validateUserAccess() {
    const storedUserId = localStorage.getItem("userId");
    const storedRole = localStorage.getItem("role") || "customer";
    const params = new URLSearchParams(window.location.search);
    const urlUserId = params.get("id");
    if (!storedUserId) { window.location.href = "login.html"; return; }
    if (urlUserId && urlUserId !== storedUserId) { alert("Unauthorized access detected!"); window.location.href = "login.html"; return; }
    userId = storedUserId;
    role = storedRole;
    window.history.replaceState({}, document.title, "dashboard.html");
  }

  async function loadDashboard() {
    document.getElementById('userId').textContent = userId;
    try {
      const res = await fetch(`${API_URL}/get-details/${userId}`);
      const data = await res.json();
      document.getElementById('welcomeName').textContent = data.username || 'User';
      document.getElementById('balance').textContent = data.balance.toFixed(2);
    } catch {
      showFlash('Failed to load dashboard', 'error');
    }
  }

  function openModal(id) { document.getElementById(id).classList.add('show'); }
  function closeModal(id) { document.getElementById(id).classList.remove('show'); document.getElementById(id).querySelector('form')?.reset(); }

  function showFlash(msg, type) {
    const el = document.getElementById('flash');
    document.getElementById('flashText').textContent = msg;
    document.getElementById('flashIcon').textContent = type === 'success' ? '✓' : '✕';
    el.className = `flash ${type} show`;
    setTimeout(() => el.classList.remove('show'), 3500);
  }

  document.getElementById('withdrawForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const data = { id: parseInt(userId), amount: parseFloat(document.getElementById('withdrawAmount').value) };
    try {
      const r = await fetch(`${API_URL}/withdraw`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data) });
      const result = await r.text();
      if (result && result.toLowerCase().includes('withdrawal')) {
        showFlash('Withdrawal successful!', 'success'); closeModal('withdrawModal'); loadDashboard();
      } else { showFlash(result || 'Withdrawal failed', 'error'); }
    } catch { showFlash('Error processing withdrawal', 'error'); }
  });

  document.getElementById('depositForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const data = { id: parseInt(userId), amount: parseFloat(document.getElementById('depositAmount').value) };
    try {
      const r = await fetch(`${API_URL}/deposit`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data) });
      const result = await r.text();
      if (result && result.toLowerCase().includes('deposit')) {
        showFlash('Deposit successful!', 'success'); closeModal('depositModal'); loadDashboard();
      } else { showFlash(result || 'Deposit failed', 'error'); }
    } catch { showFlash('Error processing deposit', 'error'); }
  });

  document.getElementById('transferForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const data = { id: parseInt(userId), amount: parseFloat(document.getElementById('transferAmount').value), username: document.getElementById('transferUsername').value };
    if (!data.username) { showFlash('Enter recipient username.', 'error'); return; }
    try {
      const r = await fetch(`${API_URL}/transfer`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data) });
      const result = await r.text();
      if (r.ok && result && result.toLowerCase().includes('successfully')) {
        showFlash('Transfer successful!', 'success'); closeModal('transferModal'); loadDashboard();
      } else { showFlash(result || 'Transfer failed', 'error'); }
    } catch { showFlash('Error processing transfer', 'error'); }
  });

  document.getElementById('updateForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const data = { id: parseInt(userId), key: document.getElementById('updateKey').value, value: document.getElementById('updateValue').value };
    try {
      const r = await fetch(`${API_URL}/update`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data) });
      const result = await r.text();
      if (r.ok && result && result.toLowerCase().includes('successfully')) {
        showFlash('Profile updated successfully!', 'success'); closeModal('updateModal'); loadDashboard();
      } else { showFlash(result || 'Update failed', 'error'); }
    } catch { showFlash('Error updating profile', 'error'); }
  });

  function goToPassbook() { window.location.href = `passbook.html?id=${userId}&role=${encodeURIComponent(role)}`; }
  function logout() { window.location.href = 'home.html'; }

  document.querySelectorAll('.modal-overlay').forEach(el => {
    el.addEventListener('click', e => { if (e.target === el) el.classList.remove('show'); });
  });

  window.addEventListener('DOMContentLoaded', () => { validateUserAccess(); loadDashboard(); });
</script>
</body>
</html>
