<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VBS — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #0a0a0f;
      --card: #16161f;
      --card2: #1c1c28;
      --surface: #0f0f18;
      --border: rgba(255,255,255,0.06);
      --border2: rgba(255,255,255,0.12);
      --gold: #f5c842;
      --gold-dim: rgba(245,200,66,0.15);
      --teal: #00d4aa;
      --teal-dim: rgba(0,212,170,0.12);
      --rose: #ff4d6d;
      --rose-dim: rgba(255,77,109,0.12);
      --text: #f0f0f5;
      --muted: #6b6b85;
      --muted2: #9898b2;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Lato', sans-serif;
      background: var(--ink);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.5;
    }

    .glow-top {
      position: fixed;
      top: -180px;
      left: 50%;
      transform: translateX(-50%);
      width: 700px;
      height: 500px;
      background: radial-gradient(ellipse, rgba(245,200,66,0.07) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .glow-bottom {
      position: fixed;
      bottom: -200px;
      right: -100px;
      width: 500px;
      height: 500px;
      background: radial-gradient(ellipse, rgba(0,212,170,0.05) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Card ── */
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border: 1px solid var(--border2);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 32px 80px rgba(0,0,0,0.5);
      animation: fadeUp 0.5s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Banner ── */
    .card-banner {
      position: relative;
      padding: 30px 32px 28px;
      text-align: center;
      border-bottom: 1px solid var(--border);
      overflow: hidden;
    }

    .card-banner::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 0%, rgba(245,200,66,0.1), transparent 70%);
      pointer-events: none;
    }

    .logo-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 4px;
    }

    .logo-mark {
      width: 42px;
      height: 42px;
      background: var(--gold);
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: 'Playfair Display', serif;
      font-weight: 800;
      font-size: 16px;
      color: #000;
      box-shadow: 0 4px 16px rgba(245,200,66,0.3);
      flex-shrink: 0;
    }

    .brand-name {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .brand-name span { color: var(--gold); }

    .banner-sub {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-top: 4px;
    }

    /* ── Body ── */
    .card-body {
      padding: 32px;
    }

    .form-title {
      font-family: 'Playfair Display', serif;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 6px;
    }

    .form-title span { color: var(--gold); }

    .form-subtitle {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 28px;
    }

    /* ── Flash ── */
    .flash {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 20px;
      animation: fadeUp 0.3s ease;
    }

    .flash.show { display: flex; }
    .flash.success { background: var(--teal-dim); border: 1px solid var(--teal); color: var(--teal); }
    .flash.error   { background: var(--rose-dim); border: 1px solid var(--rose); color: var(--rose); }

    /* ── Form ── */
    .form-group { margin-bottom: 18px; }

    .form-label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 8px;
    }

    .form-input,
    .form-select {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 13px 15px;
      color: var(--text);
      font-family: 'Lato', sans-serif;
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }

    .form-input:focus,
    .form-select:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(245,200,66,0.1);
    }

    .form-input::placeholder { color: var(--muted); }

    .form-select option { background: var(--card2); color: var(--text); }

    /* Role selector tabs */
    .role-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .role-tab {
      padding: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--muted2);
      font-family: 'Playfair Display', serif;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }

    .role-tab:hover {
      border-color: var(--border2);
      color: var(--text);
    }

    .role-tab.active {
      background: var(--gold-dim);
      border-color: var(--gold);
      color: var(--gold);
    }

    /* ── Submit ── */
    .btn-login {
      width: 100%;
      padding: 14px;
      background: var(--gold);
      color: #000;
      border: none;
      border-radius: 100px;
      font-family: 'Playfair Display', serif;
      font-weight: 800;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.25s;
      margin-top: 8px;
      letter-spacing: -0.2px;
    }

    .btn-login:hover {
      background: #ffd700;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(245,200,66,0.3);
    }

    .btn-login:active { transform: translateY(0); }

    /* ── Links ── */
    .links {
      margin-top: 22px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      text-align: center;
    }

    .link-text {
      font-size: 13px;
      color: var(--muted);
    }

    .link-text a {
      color: var(--gold);
      text-decoration: none;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .link-text a:hover { opacity: 0.8; text-decoration: underline; }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 4px 0;
    }

    @media (max-width: 400px) {
      .card-body { padding: 24px; }
      .form-title { font-size: 22px; }
    }
  </style>
</head>
<body>

<div class="glow-top"></div>
<div class="glow-bottom"></div>

<div class="card">

  <!-- Banner -->
  <div class="card-banner">
    <div class="logo-row">
      <div class="logo-mark">VB</div>
      <div class="brand-name">Virtual <span>Banking</span></div>
    </div>
    <div class="banner-sub">Secure · Simple · Swift</div>
  </div>

  <!-- Body -->
  <div class="card-body">

    <div class="form-title">Welcome <span>Back</span></div>
    <div class="form-subtitle">Sign in to access your account</div>

    <!-- Flash message -->
    <div class="flash" id="flash">
      <span id="flashIcon">✓</span>
      <span id="flashText"></span>
    </div>

    <form id="loginForm">

      <div class="form-group">
        <label class="form-label">Username</label>
        <input class="form-input" type="text" id="loginUsername" placeholder="Enter your username" required>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input class="form-input" type="password" id="loginPassword" placeholder="••••••••" required>
      </div>

      <div class="form-group">
        <label class="form-label">Role</label>
        <div class="role-tabs">
          <button type="button" class="role-tab active" id="tab-customer" onclick="selectRole('customer')">👤 Customer</button>
          <button type="button" class="role-tab" id="tab-admin" onclick="selectRole('admin')">🛡 Admin</button>
        </div>
        <input type="hidden" id="loginRole" value="customer">
      </div>

      <button type="submit" class="btn-login">Login →</button>
    </form>

    <div class="links">
      <div class="link-text">Don't have an account? <a onclick="window.location.href='signup.html'">Sign Up</a></div>
      <div class="divider"></div>
      <div class="link-text"><a onclick="window.location.href='home.html'">← Back to Home</a></div>
    </div>

  </div>
</div>

<script>
  const API_URL = 'http://localhost:8081';
  let selectedRole = 'customer';

  function selectRole(role) {
    selectedRole = role;
    document.getElementById('loginRole').value = role;
    document.getElementById('tab-customer').classList.toggle('active', role === 'customer');
    document.getElementById('tab-admin').classList.toggle('active', role === 'admin');
  }

  function showFlash(msg, type) {
    const el = document.getElementById('flash');
    document.getElementById('flashText').textContent = msg;
    document.getElementById('flashIcon').textContent = type === 'success' ? '✓' : '✕';
    el.className = `flash ${type} show`;
  }

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const loginData = {
      username: document.getElementById('loginUsername').value,
      password: document.getElementById('loginPassword').value,
      role: selectedRole
    };

    try {
      const response = await fetch(`${API_URL}/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(loginData)
      });

      const result = (await response.text()).trim();

      if (/^\d+$/.test(result)) {
        showFlash('Login successful! Redirecting…', 'success');
        localStorage.clear();
        localStorage.setItem("userId", result);
        localStorage.setItem("role", selectedRole);

        setTimeout(() => {
          window.location.href = selectedRole === 'admin'
                  ? `admin.html?id=${result}`
                  : `dashboard.html?id=${result}`;
        }, 800);
      } else {
        showFlash(result || 'Invalid credentials', 'error');
      }
    } catch {
      showFlash('Error connecting to server. Please try again.', 'error');
    }
  });
</script>

</body>
</html>
